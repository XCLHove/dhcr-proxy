# Docker Hub 代理服务器配置
# 功能：作为 Docker Hub 的反向代理，解决网络访问问题

server {
    # 监听 IPv4 的 80 端口
    listen 80;
    # 服务器名称（本地访问）
    server_name localhost;

    # DNS 解析器配置
    # 8.8.8.8: Google 公共 DNS
    # ipv6=off: 禁用 IPv6 解析，强制使用 IPv4（避免 IPv6 连接问题）
    resolver 8.8.8.8 ipv6=off;

    # ========== 全局请求处理配置 ==========

    # 客户端请求体大小限制
    # 0 表示不限制，允许传输大文件（如 Docker 镜像层）
    client_max_body_size 0;

    # 禁用请求缓冲
    # 当设置为 off 时，Nginx 会立即将客户端请求转发给代理服务器
    # 而不是先缓冲整个请求体，这对大文件传输很重要
    proxy_request_buffering off;

    # 禁用响应缓冲
    # 当设置为 off 时，Nginx 会立即将代理服务器的响应转发给客户端
    # 这对于实时传输和流式响应是必需的
    proxy_buffering off;

    # ========== Token 认证端点 ==========
    # Docker Registry 的认证服务端点
    location /token {
        # 代理到 Docker Hub 的认证服务
        proxy_pass https://auth.docker.io;

        # 设置 Host 头为 auth.docker.io
        # Docker Hub 使用虚拟主机，必须设置正确的 Host 头
        proxy_set_header Host auth.docker.io;

        # 使用 HTTP/1.1 协议与上游通信
        # HTTP/1.1 支持持久连接和分块传输
        proxy_http_version 1.1;

        # 清除 Connection 头，允许 Nginx 管理连接
        # 避免上游服务器强制关闭连接
        proxy_set_header Connection "";

        # ========== 响应头修改（Lua 处理） ==========
        # 使用 Lua 修改认证响应头中的地址
        header_filter_by_lua_block {
            -- 获取 WWW-Authenticate 响应头
            local value = ngx.header["WWW-Authenticate"]
            if value then
                -- 将响应头中的 https://auth.docker.io/token 替换为当前代理地址
                -- 这样 Docker 客户端会向本代理请求 token，而不是直接访问 Docker Hub
                value = string.gsub(value, "https://auth%.docker%.io/token", "http://" .. ngx.var.host .. "/token")
                -- 设置修改后的响应头
                ngx.header["WWW-Authenticate"] = value
            end
        }

        # ========== SSL/TLS 配置 ==========
        proxy_ssl_server_name on;
        proxy_ssl_name auth.docker.io;
        # proxy_ssl_verify off;
    }

    # ========== Docker Registry API 端点 ==========
    # 处理所有 Docker Registry V2 API 请求
    location /v2/ {
        # 使用变量存储上游服务器地址
        # 这样 Nginx 会在每次请求时重新解析 DNS，而不是缓存 IP
        set $upstream_registry "registry-1.docker.io";

        # 代理到 Docker Hub 的 registry 服务
        proxy_pass https://$upstream_registry;

        # 设置 Host 头为 registry-1.docker.io
        proxy_set_header Host registry-1.docker.io;

        # 传递客户端的 User-Agent 头
        proxy_set_header User-Agent $http_user_agent;

        # 使用 HTTP/1.1 协议与 Docker Hub 通信
        proxy_http_version 1.1;

        # 清除 Connection 头
        proxy_set_header Connection "";

        # ========== 超时配置 ==========
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;

        # ========== SSL/TLS 配置 ==========
        proxy_ssl_server_name on;
        proxy_ssl_name registry-1.docker.io;
        # proxy_ssl_verify off;

        # ========== 缓冲控制 ==========
        proxy_buffering off;
        proxy_request_buffering off;

        # ========== 关键：处理 Docker Hub 的 CDN 重定向 ==========
        # Docker Hub 返回 blob 时，经常返回 307 重定向到 CloudFront CDN
        # 如果直连 CloudFront 受限，此 Lua 脚本会将重定向目标改写为
        # 本代理的 /_cf/ 地址，让 Docker 客户端通过代理下载 blob
        #
        # 同时继续处理 WWW-Authenticate 头的地址替换
        header_filter_by_lua_block {
            -- 处理 3xx 重定向中的 CloudFront CDN URL
            if ngx.status >= 300 and ngx.status < 400 then
                local location = ngx.header["Location"]
                if location then
                    -- 将 CloudFront CDN URL（*.cloudfront.docker.com）重写为本代理地址
                    -- 例如：https://production.cloudfront.docker.com/registry-v2/...?args
                    --   → /_cf/registry-v2/...?args
                    local new_location, n, err = ngx.re.gsub(location,
                        "https://[^/]+\\.cloudfront\\.docker\\.com(/.*)",
                        "/_cf$1",
                        "jo")  -- j: PCRE JIT, o: 仅编译一次
                    if n and n > 0 then
                        ngx.header["Location"] = new_location
                        return  -- 已处理完毕，跳过下面的 WWW-Authenticate 逻辑
                    end
                end
            end

            -- 处理 WWW-Authenticate 响应头中的地址替换
            local value = ngx.header["WWW-Authenticate"]
            if value then
                value = string.gsub(value, "https://auth%.docker%.io/token", "http://" .. ngx.var.host .. "/token")
                ngx.header["WWW-Authenticate"] = value
            end
        }
    }

    # ========== CloudFront CDN blob 代理端点 ==========
    # 处理来自 /v2/ 中 Lua 脚本改写后的 CloudFront blob 下载请求
    #
    # 请求示例：
    #   GET /_cf/registry-v2/docker/registry/v2/blobs/sha256/.../data?Expires=...&Signature=...
    #
    # 工作流程：
    #   1. Docker Hub 返回 307 → 指向 CloudFront
    #   2. /v2/ 的 Lua 脚本将 Location 改写为 /_cf/...
    #   3. Docker 客户端跟随重定向，请求 /_cf/...
    #   4. 此 location 代理到 CloudFront 下载 blob
    #   5. blob 数据流式传输回 Docker 客户端
    location ~ ^/_cf(?<cf_path>/.*)$ {
        resolver 8.8.8.8 ipv6=off;

        # CloudFront CDN 域名
        set $cf_host "production.cloudfront.docker.com";

        # 代理到 CloudFront，保留原始路径和签名参数
        # $cf_path: 正则捕获的 CloudFront 路径（不含 /_cf 前缀）
        # $is_args$args: 保留原始查询参数（Expires, Signature, Key-Pair-Id）
        proxy_pass https://$cf_host$cf_path$is_args$args;

        # 设置 Host 头为 CloudFront 域名
        proxy_set_header Host $cf_host;

        # SSL/SNI 配置（关闭证书验证，slim 镜像可能没有 CA 证书）
        proxy_ssl_server_name on;
        proxy_ssl_name $cf_host;
        proxy_ssl_verify off;

        # 流式传输配置（blob 可能很大，必须流式传输）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;

        # 超时配置（blob 下载可能较慢）
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;

        # 禁用缓存（避免缓存签名 URL 导致过期）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
